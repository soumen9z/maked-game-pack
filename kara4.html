    background: linear-gradient(

        #667eea,
        #764ba2
    );

    color: white;

/* タイトル */
h1 {
    font-size: 40px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
}


/* コメント表示部分 */
#comment {
    background: rgba(255,255,255,0.9);
    color: #333;

    width: 70%;
    max-width: 700px;

    margin: 40px auto;
    padding: 30px;

    border-radius: 20px;

    font-size: 26px;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.2);
}


/* ボタン */
button {
    font-size: 18px;

    padding: 12px 30px;

    margin: 10px;

    border: none;
    border-radius: 30px;

    background: #ffcc70;
    color: #333;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 5px 10px rgba(0,0,0,0.2);
}


/* マウスを乗せた時 */
button:hover {

    transform: translateY(-3px);

    background: #ffd98e;

    box-shadow:
        0 8px 15px rgba(0,0,0,0.3);
}


/* 一覧表示 */

    max-width:700px;

    padding:20px;

// 除外するアーティスト
let excludedArtists = [];


// ランダム表示
function showRandomComment() {

// 除外されていない曲だけ取得
const availableSongs = comments.filter(song =>
    !excludedArtists.includes(song.artist)
);


// 全部除外された場合
if (availableSongs.length === 0) {

    document.getElementById("comment").textContent =
        "選択できる曲がありません";

    return;
}


const randomIndex = Math.floor(Math.random() * availableSongs.length);

const song = availableSongs[randomIndex];

    document.getElementById("comment").textContent =
        song.title + " / " + song.artist;


    // 一覧を消す
    document.getElementById("commentList").innerHTML = "";
}


// アーティストごとの一覧表示
function showAllComments() {


    // アーティスト名ごとに分類
    const artistGroups = {};


    comments.forEach(song => {

        if (!artistGroups[song.artist]) {
            artistGroups[song.artist] = [];
        }

        artistGroups[song.artist].push(song.title);

    });


    // アーティスト名順
const sortedArtists = Object.keys(artistGroups).sort((a, b) => {

    const aIsEnglish = /^[A-Za-z]/.test(a);
    const bIsEnglish = /^[A-Za-z]/.test(b);


    // 日本語を先にする
    if (aIsEnglish && !bIsEnglish) {
        return 1;
    }

    if (!aIsEnglish && bIsEnglish) {
        return -1;
    }


    // 同じ種類なら日本語順・アルファベット順
    return a.localeCompare(b, "ja");

});


    let html = "";


    sortedArtists.forEach(artist => {

        html += `<h3>${artist}</h3>`;

        html += "<ol>";

        artistGroups[artist]
            .sort((a,b) => a.localeCompare(b,"ja"))
            .forEach(title => {

                html += `<li>${title}</li>`;

            });

        html += "</ol>";

    });


    document.getElementById("commentList").innerHTML = html;

}

// 曲数表示
function showSongCount() {

    const count = comments.length;

    document.getElementById("comment").textContent =
        "現在の登録曲数は " + count + " 曲です";

    // 一覧を消す
    document.getElementById("commentList").innerHTML = "";
}

function setExcludedArtists() {

// アーティストごとの曲数を数える
    const artistCounts = {};

    comments.forEach(song => {

        if (!artistCounts[song.artist]) {
            artistCounts[song.artist] = 0;
        }

        artistCounts[song.artist]++;

    });


    // 曲数が多い順に並べる
    const artists = Object.keys(artistCounts).sort((a, b) => {

        return artistCounts[b] - artistCounts[a];

    });


    let html = "<h3>ランダムから除外するアーティスト</h3>";

    html += `
    <button onclick="checkAllArtists()">
        すべて選択
    </button>

    <button onclick="uncheckAllArtists()">
        すべて解除
    </button>

    <br><br>
    `;


    artists.forEach(artist => {

        const checked =
            excludedArtists.includes(artist)
            ? "checked"
            : "";


        html += `
        <label>
            <input 
                type="checkbox"
                value="${artist}"
                ${checked}
                onchange="updateExcludedArtists()"
            >
            ${artist}（${artistCounts[artist]}曲）
        </label>
        <br>
        `;

    });


    document.getElementById("excludeList").innerHTML = html;

    // 楽曲一覧を閉じる
    document.getElementById("commentList").innerHTML = "登録曲数で偏りが生まれてしまいますが、アーティストを除外することでカスタマイズできます";
}


function updateExcludedArtists() {

    const checkboxes =
        document.querySelectorAll(
            "#excludeList input[type='checkbox']"
        );


    excludedArtists = [];


    checkboxes.forEach(box => {

        if (box.checked) {

            excludedArtists.push(box.value);

        }

    });

}

// すべて選択
function checkAllArtists() {

    const checkboxes =
        document.querySelectorAll(
            "#excludeList input[type='checkbox']"
        );


    checkboxes.forEach(box => {

        box.checked = true;

    });


    updateExcludedArtists();

}



// すべて解除
function uncheckAllArtists() {

    const checkboxes =
        document.querySelectorAll(
            "#excludeList input[type='checkbox']"
        );


    checkboxes.forEach(box => {

        box.checked = false;

    });


    updateExcludedArtists();

}

</script>
