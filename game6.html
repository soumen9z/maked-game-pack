<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数当てゲーム</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: clamp(20px, 10vw, 200px);
            background: linear-gradient(135deg, #ffffff 0%, #983dec 100%);
        }
        #game {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        input {
            padding: 10px;
            font-size: 18px;
            width: 200px;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f96db;
        }
        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="game">
        <h1>数当てゲームで</h1>
        <h1>二分探索を直感的に理解しよう！</h1>
        <h3>※二分探索とは可能性がある範囲を<br>半分に絞って探す方法です</h3>
        <p id="rangeText">1〜100の数字を当ててください!</p>
        <select id="difficulty" onchange="resetGame()">
            <option value="100">簡単(1〜100)</option>
            <option value="500">普通(1〜500)</option>
            <option value="1000">難しい(1〜1000)</option>
        </select>
        <input type="number" id="guess" min="1" placeholder="数字を入力" onkeydown="if(event.key === 'Enter') checkGuess();">
        <br>
        <button onclick="checkGuess()">予想する</button>
        <button onclick="resetGame()">リセット</button>
        <button onclick="showHint()">ヒントを見る</button>
        <div id="message"></div>
        <p id="attempts"></p>
        <canvas id="myBarChart"></canvas>
    </div>

    <script>
        // ここにJavaScriptを書きます(次のステップ)
        // ランダムな数字を生成
        const maxNumber = parseInt(document.getElementById('difficulty').value);
        let targetNumber = Math.floor(Math.random() * maxNumber) + 1;
        let attempts = 0;
        let bestScore = localStorage.getItem('bestScore') || null;
        

        function checkGuess() {
            const maxNumber = parseInt(document.getElementById('difficulty').value);
            const guess = parseInt(document.getElementById('guess').value);
            document.getElementById("rangeText").textContent = `1〜${maxNumber}の数字を当ててください!`;

            document.getElementById("guess").max = maxNumber;
            
            const message = document.getElementById('message');
            const attemptsDisplay = document.getElementById('attempts');
    
            if (!guess || guess < 1 || guess > maxNumber) {
                message.textContent = `1〜${maxNumber}の数字を入力してください`;
                message.style.color = 'red';
                return;
            }
    
            attempts++;
    
            if (guess === targetNumber) {
                if (!bestScore || attempts < bestScore) {
                    bestScore = attempts;
                    localStorage.setItem('bestScore', bestScore);
                    message.textContent = `新記録! ${attempts}回で当たりました! 答えは${targetNumber}でした!`;
                } else {
                    message.textContent = `正解! ${attempts}回で当たりました! (最高記録: ${bestScore}回) 答えは${targetNumber}でした!`;
                }
                message.style.color = 'green';
                targetNumber = Math.floor(Math.random() * maxNumber) + 1;
                attemptsDisplay.textContent = `挑戦回数: ${attempts}回`;
                attempts = 0;
                for (let i = 0; i < guess-1; i++) {
                    chartData[i] = 0;
                }
                for (let i = guess; i < maxNumber; i++) {
                    chartData[i] = 0;
                }
                createAnswerChart();
                chartData = Array(maxNumber).fill(1);
            } else if (guess < targetNumber) {
                message.textContent = 'もっと大きい数字です';
                message.style.color = 'blue';
                for (let i = 0; i < guess; i++) {
                    chartData[i] = 0;
                }
                attemptsDisplay.textContent = `挑戦回数: ${attempts}回`;
                createChart();
            } else {
                message.textContent = 'もっと小さい数字です';
                message.style.color = 'orange';
                for (let i = guess-1; i < maxNumber; i++) {
                    chartData[i] = 0;
                }
                attemptsDisplay.textContent = `挑戦回数: ${attempts}回`;
                createChart();
            }
    
           
            document.getElementById('guess').value = '';
            
        }

        function resetGame() {
            const maxNumber = parseInt(document.getElementById('difficulty').value);
            targetNumber = Math.floor(Math.random() * maxNumber) + 1;
            document.getElementById("rangeText").textContent = `1〜${maxNumber}の数字を当ててください!`;
            attempts = 0;
            document.getElementById('message').textContent = '';
            document.getElementById('attempts').textContent = '';
            document.getElementById('guess').value = '';
            bestScore = null;
            localStorage.removeItem('bestScore');
            chartData = Array(maxNumber).fill(1)
            createChart();
        }

        function showHint() {
            const maxNumber = parseInt(document.getElementById('difficulty').value);
            const message = document.getElementById('message');
            const range = Math.floor(targetNumber / 10) * 10;
            message.textContent = `ヒント: ${range}〜${range + 10}の間です`;
            message.style.color = 'purple';
            for (let i = 0; i < range-1; i++) {
                chartData[i] = 0;
            }
            for (let i = range + 10; i < maxNumber; i++) {
                chartData[i] = 0;
            }
            createChart();
        }


        
        let myChart;
        let chartData = Array(maxNumber).fill(1);

        function createChart() {

            const maxNumber = parseInt(
                document.getElementById('difficulty').value
            );

            const labels = [];
            for (let i = 1; i <= maxNumber; i++) {
                labels.push(i);
            }

            

            const ctx = document.getElementById("myBarChart");


            // 既存グラフを削除
            if (myChart) {
                myChart.destroy();
            }


            myChart = new Chart(ctx, {

                type: "bar",

                data: {
                    labels: labels,

                    datasets: [{
                        label: "可能性",
                        data: chartData,
                        backgroundColor: "#cf596d",
                        barThickness: 5
                    }]
                },

                options: {
                    responsive: true,

                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                display: false
                            }
                        }
                    }
                }

            });
        }
        createChart();

                function createAnswerChart() {

            const maxNumber = parseInt(
                document.getElementById('difficulty').value
            );

            const labels = [];
            for (let i = 1; i <= maxNumber; i++) {
                labels.push(i);
            }

            

            const ctx = document.getElementById("myBarChart");


            // 既存グラフを削除
            if (myChart) {
                myChart.destroy();
            }


            myChart = new Chart(ctx, {

                type: "bar",

                data: {
                    labels: labels,

                    datasets: [{
                        label: "正解",
                        data: chartData,
                        backgroundColor: "orange",
                        barThickness: 5
                    }]
                },

                options: {
                    responsive: true,

                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                display: false
                            }
                        }
                    }
                }

            });
        }
        createChart();

    </script>
</body>
</html>
