<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トップページ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;

      /* 背景 */
      background: linear-gradient(
        135deg,
        #74ebd5,
        #9face6
      );
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: rgba(255,255,255,0.9);
      padding: 40px 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      color: #333;
      font-size: 32px;
    }

    .comment {
      margin: 20px 0 30px;
      color: #555;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: block;
      margin: 18px auto;
      padding: 18px;
      width: 100%;

      background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
      );

      color: white;
      text-decoration: none;
      border-radius: 50px;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 5px 15px rgba(102,126,234,0.4);

      transition: 0.3s;
    }

    .button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(102,126,234,0.5);
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>✨ My Link Page ✨</h1>

  <p class="comment">
    ようこそ！<br>
    下のボタンから私が作成したページへアクセスできます。<br>
    お好きなリンクを選択してください。
  </p>


  <a class="button" href="https://soumen9z.github.io/maked-game-pack/game6">
    🎮数当てゲーム
  </a>


  <a class="button" href="https://soumen9z.github.io/maked-game-pack/kara4">
    🎤カラオケガチャ
  </a>




</div>

</body>
</html>
